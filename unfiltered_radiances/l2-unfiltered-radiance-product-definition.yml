# Libera Data Product Definition
# This file defines the metadata and structure for your science data product
#
# Modify the ProductID and version to match your specific data product
# Update the variables section to match your science data outputs
#
# For more information on Libera data product identifiers, see:
# https://libera-utils.readthedocs.io/en/latest/

attributes:
  ProductID: UNF-RAD
  algorithm_version: 0.1.0
  lw_regression_method: "Univariate regression"
  sw_regression_method: "Univariate regression"
  ssw_regression_method: "Multivariate quadratic regression"
  tot_regression_method: "Univariate regression"

coordinates:
  radiometer_time:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: >-
        Time of each measurement (UTC) against a base reference of the CCSDS Epoch (January 1, 1958).
        Uniquely identifies each camera sample.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  shortwave_unfiltered_radiance:
    long_name: "Shortwave Unfiltered radiance measurements"
    dimensions: ["RADIOMETER_TIME"]
    units: "W/(m^2*sr*nm)"  # Watts per square meter per steradian per nanometer
    valid_range: [0, 1000]  
    missing_value: -9999.0
    dtype: float64

  longwave_unfiltered_radiance:
    long_name: "Longwave Unfiltered radiance measurements"
    dimensions: ["RADIOMETER_TIME"]
    units: "W/(m^2*sr*nm)"  # Watts per square meter per steradian per nanometer
    valid_range: [0, 1000]  
    missing_value: -9999.0
    dtype: float64

  split_shortwave_unfiltered_radiance:
    long_name: "SplitShortwave Unfiltered radiance measurements"
    dimensions: ["RADIOMETER_TIME"]
    units: "W/(m^2*sr*nm)"  # Watts per square meter per steradian per nanometer
    valid_range: [0, 1000]  
    missing_value: -9999.0
    dtype: float64

  total_unfiltered_radiance:
    long_name: "Total Unfiltered radiance measurements"
    dimensions: ["RADIOMETER_TIME"]
    units: "W/(m^2*sr*nm)"  # Watts per square meter per steradian per nanometer
    valid_range: [0, 1000]  
    missing_value: -9999.0
    dtype: float64

  latitude:
    long_name: "Geodetic latitude"
    dimensions: ["RADIOMETER_TIME"]
    units: "degrees_north"
    valid_range: [-90, 90]
    missing_value: -999.0
    dtype: float64

  longitude:
    long_name: "Geodetic longitude"
    dimensions: ["RADIOMETER_TIME"]
    units: "degrees_east"
    valid_range: [-180, 180]
    missing_value: -999.0
    dtype: float64

  quality_flags:
    long_name: "Data quality flags"
    dimensions: ["RADIOMETER_TIME"]
    units: "1"  # Dimensionless
    valid_range: [0, 255]  # 8-bit flags: 0=good, 1=questionable, 2=bad, etc.
    missing_value: -1
    dtype: int32

# Notes for customization:
#
# 1. ProductID: Update this to match your specific data product identifier
#    Check with your team for the correct naming convention
#
# 2. Variables: Add, remove, or modify variables to match your science outputs
#    - Each variable name should match the keys in your processed_data dictionary
#    - Dimensions currently use only "n_samples" for 1D time series data
#    - For 2D/3D data, you can add dimensions like ["n_samples", "n_wavelengths"]
#
# 3. Units: Use CF-convention units where possible
#    See: http://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
#
# 4. Valid ranges: Set these based on your actual expected data ranges
#    This helps with data validation and quality control
#
# 5. Missing values: Choose appropriate missing value indicators for each data type
#    Use values that are clearly outside your valid_range
#
# 6. Data types: Common options include:
#    - "float64" or "float32" for continuous measurements
#    - "int32" or "int16" for integer data and flags
#    - "datetime64[ns]" for timestamps